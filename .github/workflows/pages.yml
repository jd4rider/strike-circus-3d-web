name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare the site
        run: node scripts/prepare-site.mjs
      - name: Check the payload is servable
        run: |
          set -euo pipefail
          test -f site/play/Build/WebGL.wasm
          test -f site/play/Build/WebGL.data
          test -f site/play/Build/WebGL.loader.js
          test -f site/index.html
          ! grep -q '\.br"' site/play/index.html
          head -c 4 site/play/Build/WebGL.wasm | od -An -c | grep -q '\\0   a   s   m'
          du -sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
